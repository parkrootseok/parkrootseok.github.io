<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>parkrootseok 기술 블로그</title>
<meta name="description" content="백엔드 개발자 parkrootseok의 기술 블로그. 실제로 한 일을 문제, 선택, 결과 순서로 정리합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 블로그 첫 페이지(사례 우선형). 글 본문과 같은 문서형 단일 열, 같은 디자인 토큰 */
:root {
  color-scheme: light;
  --ink: #1A1A1A; --ink-2: #4D4D4D; --gray: #808080; --line: #E6E6E6;
  --paper: #FFFFFF; --wash: #F5F5F5;
  --blue: #0F75FA; --blue-dark: #045DD2; --blue-soft: #EBF3FF;
  --font-body: "Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--wash); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
a { color: var(--blue-dark); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.doc { max-width: 1040px; min-height: 100vh; margin: 0 auto; background: var(--paper); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 56px 80px; display: flex; flex-direction: column; gap: 48px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
@media (min-width: 920px) { .doc { padding-left: 56px; padding-right: 56px; } }

/* 머리말 */
header { display: flex; flex-direction: column; gap: 10px; }
.handle { font-family: var(--font-mono); font-size: 13px; color: var(--gray); }
h1 { font-size: 30px; line-height: 1.35; margin: 0; font-weight: 700; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 60ch; }
.links { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; margin: 0; padding: 0; list-style: none; }

/* 절 */
section { display: flex; flex-direction: column; gap: 14px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
h2 { font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: 0.04em; margin: 0; }
.sec-note { font-size: 13px; color: var(--gray); }

/* 대표 사례 카드: 결과 수치가 먼저 보이게 */
.cases { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 760px) { .cases { grid-template-columns: 1fr 1fr; } }
.case { display: flex; flex-direction: column; gap: 12px; padding: 22px 22px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); text-decoration: none; color: inherit; transition: border-color .15s; }
.case:hover { border-color: var(--blue); }
.case:hover .title { color: var(--blue-dark); }
.case .kind { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
.case .title { font-size: 18px; font-weight: 700; line-height: 1.45; }
.case .problem { color: var(--ink-2); font-size: 14.5px; margin: 0; }
.kpis { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 12px 14px; background: var(--blue-soft); border-radius: 6px; }
.kpi { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.kpi dt { font-size: 12.5px; color: var(--ink-2); min-width: 7em; }
.kpi dd { margin: 0; font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); }
.kpi dd b { font-size: 17px; font-weight: 500; color: var(--blue-dark); }
.case .choice { margin: 0; font-size: 14px; color: var(--ink); }
.case .choice::before { content: "선택 "; font-size: 12.5px; font-weight: 700; color: var(--blue-dark); }
.case .more { margin-top: auto; font-size: 13.5px; color: var(--blue-dark); }

/* 다른 글 목록 */
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.post { display: flex; flex-direction: column; gap: 6px; padding: 18px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.post:hover .title { color: var(--blue-dark); }
.post .title { font-size: 17px; font-weight: 700; }
.post .sum { color: var(--ink-2); font-size: 14.5px; }
.post .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--gray); }
.tag { background: var(--wash); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--ink-2); }

/* 빈 상태: 목록 안에 항목이 없으면(주석만 있으면) 안내 문구를 보이고, 다른 글 절은 통째로 숨긴다 */
.cases:empty { display: block; }
.cases:empty::before { content: "첫 사례를 정리하고 있습니다."; display: block; border: 1px dashed var(--line); border-radius: 8px; padding: 32px 20px; color: var(--ink-2); font-size: 14.5px; text-align: center; }
section:has(> .list:empty) { display: none; }

footer { margin-top: auto; font-size: 12.5px; color: var(--gray); }
</style>
</head>
<body>
<main class="doc">
  <header>
    <span class="handle">parkrootseok.github.io</span>
    <h1>parkrootseok 기술 블로그</h1>
    <p class="lede">백엔드 개발자로 실제로 한 일을 문제, 선택, 결과 순서로 정리합니다.</p>
    <ul class="links">
      <li><a href="https://github.com/parkrootseok">GitHub</a></li>
    </ul>
  </header>

  <section aria-labelledby="cases-title">
    <div class="sec-head">
      <h2 id="cases-title">대표 사례</h2>
      <span class="sec-note">무엇이 문제였고, 무엇을 골랐고, 얼마나 나아졌는지</span>
    </div>
    <div class="cases"><!-- 사례 상세 글(쓰임: 포트폴리오)을 올릴 때 맨 앞에 하나씩 더한다. 수치는 검증된 성과 카드 값만 쓴다. 형식:
      <a class="case" href="posts/{주소용 이름}/">
        <span class="kind"><span class="tag">분류</span><span class="tag">기술</span></span>
        <span class="title">제목</span>
        <p class="problem">무엇이 문제였는지 한 문장</p>
        <dl class="kpis">
          <div class="kpi"><dt>지표 이름</dt><dd>전 → <b>후</b></dd></div>
        </dl>
        <p class="choice">고른 방법 한 줄</p>
        <span class="more">사례 읽기 →</span>
      </a>
    --></div>
  </section>

  <section aria-labelledby="posts-title">
    <div class="sec-head">
      <h2 id="posts-title">다른 글</h2>
    </div>
    <div class="list"><!-- 사례가 아닌 글을 올릴 때 맨 위에 하나씩 더한다. 형식:
      <a class="post" href="posts/{주소용 이름}/">
        <span class="title">제목</span>
        <span class="sum">한 줄 요약</span>
        <span class="meta"><span>YYYY-MM-DD</span><span class="tag">태그</span></span>
      </a>
    --></div>
  </section>

  <footer>© parkrootseok</footer>
</main>
</body>
</html>
