<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>parkrootseok 기술 블로그</title>
<meta name="description" content="백엔드 개발자 parkrootseok의 기술 블로그. 실제로 한 일을 문제, 선택, 결과 순서로 정리합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 블로그 목록. 글 본문과 같은 문서형 단일 열, 같은 디자인 토큰 */
:root {
  color-scheme: light;
  --ink: #1A1A1A; --ink-2: #4D4D4D; --gray: #808080; --line: #E6E6E6;
  --paper: #FFFFFF; --wash: #F5F5F5;
  --blue: #0F75FA; --blue-dark: #045DD2; --blue-soft: #EBF3FF;
  --font-body: "Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--wash); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
a { color: var(--blue-dark); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.doc { max-width: 1040px; min-height: 100vh; margin: 0 auto; background: var(--paper); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 56px 80px; display: flex; flex-direction: column; gap: 40px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
@media (min-width: 920px) { .doc { padding-left: 56px; padding-right: 56px; } }
header { display: flex; flex-direction: column; gap: 10px; }
.handle { font-family: var(--font-mono); font-size: 13px; color: var(--gray); }
h1 { font-size: 30px; line-height: 1.35; margin: 0; font-weight: 700; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); }
.links { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; margin: 0; padding: 0; list-style: none; }
h2 { font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: 0.04em; margin: 0; }
.list { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
.post { display: flex; flex-direction: column; gap: 6px; padding: 20px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.post:hover .title { color: var(--blue-dark); }
.post .title { font-size: 18px; font-weight: 700; }
.post .sum { color: var(--ink-2); font-size: 14.5px; }
.post .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--gray); }
.tag { background: var(--wash); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--ink-2); }
.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 28px 20px; color: var(--ink-2); font-size: 14.5px; text-align: center; }
footer { margin-top: auto; font-size: 12.5px; color: var(--gray); }
</style>
</head>
<body>
<main class="doc">
  <header>
    <span class="handle">parkrootseok.github.io</span>
    <h1>parkrootseok 기술 블로그</h1>
    <p class="lede">백엔드 개발자로 실제로 한 일을 문제, 선택, 결과 순서로 정리합니다.</p>
    <ul class="links">
      <li><a href="https://github.com/parkrootseok">GitHub</a></li>
    </ul>
  </header>

  <section aria-labelledby="posts-title" style="display:flex;flex-direction:column;gap:12px">
    <h2 id="posts-title">글</h2>
    <!-- 글을 올릴 때 이 목록 맨 위에 하나씩 더한다. 형식:
    <a class="post" href="posts/{주소용 이름}/">
      <span class="title">제목</span>
      <span class="sum">한 줄 요약</span>
      <span class="meta"><span>YYYY-MM-DD</span><span class="tag">태그</span></span>
    </a>
    -->
    <div class="list">
      <p class="empty">첫 글을 준비하고 있습니다.</p>
    </div>
  </section>

  <footer>© parkrootseok</footer>
</main>
</body>
</html>
